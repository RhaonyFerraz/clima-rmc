<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Profundo e Moderno -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradiente do Sol / Energia -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Gradiente das Linhas Atmosféricas -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo com Cantos Arredondados (Formato Padrão de Ícones Mobile) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGradient)" />

  <!-- Borda Sutil de Vidro/Luz -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.12" />

  <!-- Elemento Central: Sol Minimalista + Ondas Atmosféricas / Vento Limpo -->
  <g filter="url(#softGlow)">
    <!-- Sol Solar Minimalista -->
    <circle cx="216" cy="216" r="76" fill="url(#sunGrad)" />

    <!-- Arco Superior de Atmosfera / Brisa -->
    <path d="M 130 290 Q 220 230 350 250" 
          fill="none" 
          stroke="url(#streamGrad1)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Arco Intermediário / Dinâmica Climática -->
    <path d="M 160 350 Q 270 300 380 324" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          opacity="0.92" />

    <!-- Arco Inferior Suave -->
    <path d="M 210 404 Q 290 376 348 388" 
          fill="none" 
          stroke="url(#streamGrad2)" 
          stroke-width="20" 
          stroke-linecap="round" />
  </g>
</svg>
