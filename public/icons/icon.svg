<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="50%" stop-color="#0a3060" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo institucional moderno -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Moldura discreta -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" />

  <!-- Conteudo textual institucional UNIVESP / Projeto Integrador -->
  <g filter="url(#glow)">
    <!-- Sigla UNIVESP em destaque -->
    <text x="256" y="225" 
          text-anchor="middle" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="76" 
          font-weight="900" 
          letter-spacing="6">UNIVESP</text>
    
    <!-- Linha divisória com gradiente -->
    <rect x="136" y="255" width="240" height="4" rx="2" fill="#38bdf8" opacity="0.85" />

    <!-- Projeto Integrador II -->
    <text x="256" y="305" 
          text-anchor="middle" 
          fill="#bae6fd" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="26" 
          font-weight="700" 
          letter-spacing="2">PROJETO INTEGRADOR II</text>

    <!-- Turma e Polo -->
    <text x="256" y="345" 
          text-anchor="middle" 
          fill="#94a3b8" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="1">DRP04 • TURMA 005</text>
  </g>
</svg>
