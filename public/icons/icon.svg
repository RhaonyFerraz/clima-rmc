<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Sol Climático -->
    <circle cx="340" cy="180" r="70" fill="url(#sunGrad)" />

    <!-- Nuvem Suave -->
    <path d="M190 310 h170 a60 60 0 0 0 0 -120 a75 75 0 0 0 -140 -20 a50 50 0 0 0 -30 95 a30 30 0 0 0 0 45 z" fill="#ffffff" opacity="0.95" />

    <!-- Folha Ecológica / Qualidade do Ar -->
    <path d="M256 260 C210 260 170 300 170 350 C230 350 270 320 270 260 Z" fill="url(#leafGrad)" />
    <path d="M256 260 Q 210 320 170 350" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- Detalhe moderno na borda -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
</svg>
